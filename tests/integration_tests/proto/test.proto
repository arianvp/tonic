syntax = "proto3";

package test;

service Test {
  rpc UnaryCall(Input) returns (Output);
}

// Only used by the GOAWAY tests, which run against a raw h2 server. Kept
// separate from `Test` so the servers other tests implement are unchanged.
service ClientStream {
  rpc ClientStreamCall(stream Input) returns (Output);
}

message Input {}
message Output {}

service Test1 {
  rpc UnaryCall(Input1) returns (Output1);

  rpc StreamCall(Input1) returns (stream Output1);
}

message Input1 {
  bytes buf = 1;
}
message Output1 {
  bytes buf = 1;
}
